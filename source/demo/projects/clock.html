<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动态时钟</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .clock-container {
      text-align: center;
      color: white;
    }
    .clock {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      position: relative;
      margin: 0 auto 30px;
      box-shadow: 0 0 60px rgba(79, 172, 254, 0.3);
    }
    .clock-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      background: #4facfe;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }
    .hour-marks {
      position: absolute;
      width: 100%;
      height: 100%;
    }
    .hour-mark {
      position: absolute;
      width: 3px;
      height: 12px;
      background: rgba(255, 255, 255, 0.6);
      left: 50%;
      top: 10px;
      transform-origin: 50% 140px;
    }
    .minute-marks {
      position: absolute;
      width: 100%;
      height: 100%;
    }
    .minute-mark {
      position: absolute;
      width: 1px;
      height: 6px;
      background: rgba(255, 255, 255, 0.3);
      left: 50%;
      top: 10px;
      transform-origin: 50% 140px;
    }
    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: bottom center;
      border-radius: 4px;
    }
    .hour-hand {
      width: 6px;
      height: 70px;
      background: linear-gradient(to top, #4facfe, #00f2fe);
      margin-left: -3px;
    }
    .minute-hand {
      width: 4px;
      height: 90px;
      background: linear-gradient(to top, #ff6b6b, #ee5a24);
      margin-left: -2px;
    }
    .second-hand {
      width: 2px;
      height: 100px;
      background: #fff;
      margin-left: -1px;
    }
    .digital-time {
      font-size: 48px;
      font-weight: 300;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .date {
      font-size: 18px;
      opacity: 0.8;
      margin-top: 10px;
      letter-spacing: 1px;
    }
    .greeting {
      font-size: 24px;
      margin-bottom: 20px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="clock-container">
    <div class="greeting" id="greeting">Good Day</div>
    <div class="clock">
      <div class="hour-marks" id="hour-marks"></div>
      <div class="minute-marks" id="minute-marks"></div>
      <div class="hand hour-hand" id="hour-hand"></div>
      <div class="hand minute-hand" id="minute-hand"></div>
      <div class="hand second-hand" id="second-hand"></div>
      <div class="clock-center"></div>
    </div>
    <div class="digital-time" id="digital-time">00:00:00</div>
    <div class="date" id="date"></div>
  </div>

  <script>
    function initMarks() {
      const hourMarks = document.getElementById('hour-marks');
      const minuteMarks = document.getElementById('minute-marks');
      
      for (let i = 0; i < 12; i++) {
        const mark = document.createElement('div');
        mark.className = 'hour-mark';
        mark.style.transform = `rotate(${i * 30}deg)`;
        hourMarks.appendChild(mark);
      }
      
      for (let i = 0; i < 60; i++) {
        if (i % 5 !== 0) {
          const mark = document.createElement('div');
          mark.className = 'minute-mark';
          mark.style.transform = `rotate(${i * 6}deg)`;
          minuteMarks.appendChild(mark);
        }
      }
    }
    
    function updateClock() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      
      const hourDeg = ((hours % 12) + minutes / 60) * 30;
      const minuteDeg = (minutes + seconds / 60) * 6;
      const secondDeg = seconds * 6;
      
      document.getElementById('hour-hand').style.transform = `rotate(${hourDeg}deg)`;
      document.getElementById('minute-hand').style.transform = `rotate(${minuteDeg}deg)`;
      document.getElementById('second-hand').style.transform = `rotate(${secondDeg}deg)`;
      
      const h = hours.toString().padStart(2, '0');
      const m = minutes.toString().padStart(2, '0');
      const s = seconds.toString().padStart(2, '0');
      document.getElementById('digital-time').textContent = `${h}:${m}:${s}`;
      
      const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const weekDay = weekDays[now.getDay()];
      document.getElementById('date').textContent = `${month}月${day}日 ${weekDay}`;
      
      let greeting = '';
      if (hours >= 5 && hours < 12) greeting = '🌅 早上好';
      else if (hours >= 12 && hours < 14) greeting = '☀️ 中午好';
      else if (hours >= 14 && hours < 18) greeting = '🌤️ 下午好';
      else greeting = '🌙 晚上好';
      document.getElementById('greeting').textContent = greeting;
    }
    
    initMarks();
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
