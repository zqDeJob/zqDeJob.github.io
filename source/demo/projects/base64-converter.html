<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片 Base64 转换器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      color: white;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      font-weight: 700;
      text-shadow: 0 2px 20px rgba(0,0,0,0.2);
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .main-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .card-tabs {
      display: flex;
      background: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
    }

    .tab-btn {
      flex: 1;
      padding: 16px;
      border: none;
      background: transparent;
      font-size: 1rem;
      font-weight: 500;
      color: #666;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .tab-btn.active {
      color: #667eea;
      background: #fff;
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 3px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 2px;
    }

    .tab-content {
      padding: 24px;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
    }

    .converter-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .panel {
      background: #fafafa;
      border-radius: 16px;
      padding: 20px;
      transition: all 0.3s ease;
      min-height: 400px;
      display: flex;
      flex-direction: column;
    }

    .panel:hover {
      background: #f5f5f5;
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .panel-title i {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 1.2rem;
    }

    .panel-title .icon-img {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
    }

    .panel-title .icon-code {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: white;
    }

    .drop-zone {
      border: 2px dashed #ddd;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #667eea;
      background: rgba(102, 126, 234, 0.05);
    }

    .drop-zone i {
      font-size: 3rem;
      color: #667eea;
      margin-bottom: 12px;
    }

    .drop-zone p {
      color: #666;
      font-size: 0.95rem;
    }

    .drop-zone small {
      color: #999;
      font-size: 0.8rem;
      margin-top: 8px;
    }

    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
      max-height: 350px;
      overflow: hidden;
      border-radius: 10px;
      background: #fff;
    }

    .preview-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .preview-placeholder {
      color: #999;
      text-align: center;
      padding: 40px;
    }

    .textarea-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }

    textarea {
      flex: 1;
      width: 100%;
      min-height: 180px;
      max-height: 350px;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.75rem;
      line-height: 1.6;
      resize: none;
      overflow-y: auto;
      transition: all 0.3s ease;
      background: #fff;
      word-break: break-all;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .btn {
      flex: 1;
      min-width: 120px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #333;
      color: white;
      padding: 14px 24px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.success {
      background: linear-gradient(135deg, #11998e, #38ef7d);
    }

    .toast.error {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: #666;
      flex-shrink: 0;
    }

    .file-size {
      font-family: monospace;
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: #667eea;
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: underline;
    }

    .copy-btn:hover {
      color: #764ba2;
    }

    @media (max-width: 768px) {
      .converter-section {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .btn-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .tab-content {
        max-height: calc(100vh - 180px);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔄 图片 Base64 转换器</h1>
      <p>粘贴图片获取 Base64，或输入 Base64 还原图片</p>
    </div>

    <div class="main-card">
      <div class="card-tabs">
        <button class="tab-btn active" id="tab-encode">图片 → Base64</button>
        <button class="tab-btn" id="tab-decode">Base64 → 图片</button>
      </div>

      <div class="tab-content">
        <div id="encode-panel" class="converter-section">
          <div class="panel">
            <div class="panel-title">
              <i class="icon-img">📷</i>
              <span>上传图片</span>
            </div>
            <div class="drop-zone" id="drop-zone">
              <i>🖼️</i>
              <p>点击或拖拽图片到此处</p>
              <small>或直接粘贴图片（Ctrl+V）</small>
            </div>
            <input type="file" id="file-input" accept="image/*" hidden>
            <div class="preview-container" id="encode-preview-container">
              <div class="preview-placeholder">图片预览区域</div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-title">
              <i class="icon-code">&lt;/&gt;</i>
              <span>Base64 结果</span>
            </div>
            <div class="textarea-wrapper">
              <textarea id="base64-output" placeholder="Base64 编码将显示在这里..." readonly></textarea>
            </div>
            <div class="info-bar">
              <span class="file-size" id="output-size">0 KB</span>
              <button class="copy-btn" id="copy-encode">复制代码</button>
            </div>
            <div class="btn-group">
              <button class="btn btn-primary" id="copy-encode-btn">
                <span>📋</span> 复制 Base64
              </button>
              <button class="btn btn-secondary" id="clear-encode-btn">
                <span>🗑️</span> 清空
              </button>
            </div>
          </div>
        </div>

        <div id="decode-panel" class="converter-section" style="display: none;">
          <div class="panel">
            <div class="panel-title">
              <i class="icon-code">&lt;/&gt;</i>
              <span>Base64 代码</span>
            </div>
            <div class="textarea-wrapper">
              <textarea id="base64-input" placeholder="粘贴 Base64 编码..."></textarea>
            </div>
            <div class="btn-group">
              <button class="btn btn-primary" id="decode-btn">
                <span>🔄</span> 转换为图片
              </button>
              <button class="btn btn-secondary" id="clear-decode-btn">
                <span>🗑️</span> 清空
              </button>
            </div>
          </div>

          <div class="panel">
            <div class="panel-title">
              <i class="icon-img">🖼️</i>
              <span>图片预览</span>
            </div>
            <div class="preview-container" id="decode-preview-container">
              <div class="preview-placeholder">解码后的图片将显示在这里</div>
            </div>
            <div class="info-bar" id="decode-info" style="display: none;">
              <span class="file-size" id="decode-size">0 KB</span>
              <button class="copy-btn" id="download-btn">下载图片</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const tabEncode = document.getElementById('tab-encode');
    const tabDecode = document.getElementById('tab-decode');
    const encodePanel = document.getElementById('encode-panel');
    const decodePanel = document.getElementById('decode-panel');

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const encodePreviewContainer = document.getElementById('encode-preview-container');
    const base64Output = document.getElementById('base64-output');
    const outputSize = document.getElementById('output-size');

    const base64Input = document.getElementById('base64-input');
    const decodePreviewContainer = document.getElementById('decode-preview-container');
    const decodeInfo = document.getElementById('decode-info');
    const decodeSize = document.getElementById('decode-size');

    const toast = document.getElementById('toast');

    let currentImageData = null;
    let encodeImgElement = null;
    let decodeImgElement = null;

    function showToast(message, type = 'success') {
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function clearPreview(container) {
      while (container.firstChild) {
        if (container.firstChild.tagName !== 'DIV' || !container.firstChild.classList.contains('preview-placeholder')) {
          container.removeChild(container.firstChild);
        } else {
          break;
        }
      }
      const placeholder = container.querySelector('.preview-placeholder');
      if (placeholder) placeholder.style.display = 'block';
    }

    function createImageElement(src) {
      const img = document.createElement('img');
      img.src = src;
      img.alt = '预览';
      img.style.maxWidth = '100%';
      img.style.maxHeight = '100%';
      img.style.objectFit = 'contain';
      return img;
    }

    function imageToBase64(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result;
        base64Output.value = base64;
        outputSize.textContent = formatSize(base64.length);
        currentImageData = base64;

        clearPreview(encodePreviewContainer);
        encodeImgElement = createImageElement(base64);
        encodePreviewContainer.appendChild(encodeImgElement);
        const placeholder = encodePreviewContainer.querySelector('.preview-placeholder');
        if (placeholder) placeholder.style.display = 'none';
        
        showToast('✅ 图片转换成功！');
      };
      reader.readAsDataURL(file);
    }

    function pasteImage(e) {
      const items = e.clipboardData?.items;
      if (!items) return;

      for (const item of items) {
        if (item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) {
            imageToBase64(file);
            showToast('📋 图片粘贴成功！');
          }
          break;
        }
      }
    }

    dropZone.addEventListener('click', () => {
      fileInput.click();
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const files = e.dataTransfer?.files;
      if (files && files.length > 0 && files[0].type.startsWith('image/')) {
        imageToBase64(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (file && file.type.startsWith('image/')) {
        imageToBase64(file);
      }
    });

    document.addEventListener('paste', (e) => {
      const activeElement = document.activeElement;
      if (activeElement === base64Input) {
        return;
      }
      pasteImage(e);
    });

    document.getElementById('copy-encode-btn').addEventListener('click', async () => {
      if (!base64Output.value) {
        showToast('❌ 没有可复制的内容', 'error');
        return;
      }
      try {
        await navigator.clipboard.writeText(base64Output.value);
        showToast('✅ Base64 已复制到剪贴板！');
      } catch (err) {
        showToast('❌ 复制失败', 'error');
      }
    });

    document.getElementById('clear-encode-btn').addEventListener('click', () => {
      base64Output.value = '';
      outputSize.textContent = '0 KB';
      clearPreview(encodePreviewContainer);
      currentImageData = null;
      encodeImgElement = null;
      showToast('🗑️ 已清空');
    });

    document.getElementById('decode-btn').addEventListener('click', () => {
      const base64 = base64Input.value.trim();
      if (!base64) {
        showToast('❌ 请输入 Base64 代码', 'error');
        return;
      }

      try {
        if (!base64.startsWith('data:image/')) {
          showToast('❌ 无效的 Base64 格式', 'error');
          return;
        }

        clearPreview(decodePreviewContainer);
        decodeImgElement = createImageElement(base64);
        
        decodeImgElement.onload = function() {
          decodePreviewContainer.appendChild(decodeImgElement);
          const placeholder = decodePreviewContainer.querySelector('.preview-placeholder');
          if (placeholder) placeholder.style.display = 'none';
          decodeInfo.style.display = 'flex';
          decodeSize.textContent = formatSize(base64.length);
          currentImageData = base64;
          showToast('✅ Base64 解码成功！');
        };
        
        decodeImgElement.onerror = function() {
          clearPreview(decodePreviewContainer);
          showToast('❌ Base64 解码失败', 'error');
        };
      } catch (err) {
        showToast('❌ Base64 解码失败', 'error');
      }
    });

    document.getElementById('clear-decode-btn').addEventListener('click', () => {
      base64Input.value = '';
      clearPreview(decodePreviewContainer);
      decodeInfo.style.display = 'none';
      currentImageData = null;
      decodeImgElement = null;
      showToast('🗑️ 已清空');
    });

    document.getElementById('download-btn').addEventListener('click', () => {
      if (!currentImageData) return;

      const link = document.createElement('a');
      link.href = currentImageData;
      link.download = `image_${Date.now()}.png`;
      link.click();
      showToast('📥 图片下载成功！');
    });

    tabEncode.addEventListener('click', () => {
      tabEncode.classList.add('active');
      tabDecode.classList.remove('active');
      encodePanel.style.display = 'grid';
      decodePanel.style.display = 'none';
    });

    tabDecode.addEventListener('click', () => {
      tabDecode.classList.add('active');
      tabEncode.classList.remove('active');
      decodePanel.style.display = 'grid';
      encodePanel.style.display = 'none';
    });
  </script>
</body>
</html>
