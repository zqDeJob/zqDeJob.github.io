<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办事项应用</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      padding: 24px;
      text-align: center;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 600;
    }
    .header p {
      opacity: 0.9;
      margin-top: 4px;
    }
    .input-area {
      padding: 16px;
      border-bottom: 1px solid #eee;
    }
    #todo-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    #todo-input:focus {
      border-color: #4facfe;
    }
    #todo-list {
      list-style: none;
      padding: 8px;
      max-height: 400px;
      overflow-y: auto;
    }
    .todo-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      margin: 8px;
      background: #f8f9fa;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .todo-item:hover {
      background: #e9ecef;
    }
    .todo-item.completed {
      opacity: 0.6;
    }
    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #999;
    }
    .checkbox {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #ddd;
      margin-right: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .checkbox.checked {
      background: #4facfe;
      border-color: #4facfe;
    }
    .checkbox.checked::after {
      content: '✓';
      color: white;
      font-size: 12px;
    }
    .todo-text {
      flex: 1;
      font-size: 15px;
      color: #333;
    }
    .delete-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      transition: all 0.2s;
    }
    .delete-btn:hover {
      background: #ff4757;
      color: white;
    }
    .stats {
      padding: 16px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #666;
    }
    .btn-clear {
      background: #ff4757;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.2s;
    }
    .btn-clear:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📝 待办事项</h1>
      <p>记录每一天的小目标</p>
    </div>
    
    <div class="input-area">
      <input type="text" id="todo-input" placeholder="添加新任务...">
    </div>
    
    <ul id="todo-list"></ul>
    
    <div class="stats">
      <span>共 <span id="total-count">0</span> 项，已完成 <span id="completed-count">0</span> 项</span>
      <button class="btn-clear" id="clear-btn">清除已完成</button>
    </div>
  </div>

  <script>
    const todoInput = document.getElementById('todo-input');
    const todoList = document.getElementById('todo-list');
    const totalCount = document.getElementById('total-count');
    const completedCount = document.getElementById('completed-count');
    const clearBtn = document.getElementById('clear-btn');
    
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    
    function renderTodos() {
      todoList.innerHTML = '';
      todos.forEach((todo, index) => {
        const li = document.createElement('li');
        li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <div class="checkbox ${todo.completed ? 'checked' : ''}" data-index="${index}"></div>
          <span class="todo-text">${todo.text}</span>
          <button class="delete-btn" data-index="${index}">×</button>
        `;
        todoList.appendChild(li);
      });
      updateStats();
    }
    
    function updateStats() {
      totalCount.textContent = todos.length;
      completedCount.textContent = todos.filter(t => t.completed).length;
    }
    
    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }
    
    todoInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter' && todoInput.value.trim()) {
        todos.push({ text: todoInput.value.trim(), completed: false });
        todoInput.value = '';
        saveTodos();
        renderTodos();
      }
    });
    
    todoList.addEventListener('click', (e) => {
      const index = parseInt(e.target.dataset.index);
      if (e.target.classList.contains('checkbox')) {
        todos[index].completed = !todos[index].completed;
        saveTodos();
        renderTodos();
      } else if (e.target.classList.contains('delete-btn')) {
        todos.splice(index, 1);
        saveTodos();
        renderTodos();
      }
    });
    
    clearBtn.addEventListener('click', () => {
      todos = todos.filter(t => !t.completed);
      saveTodos();
      renderTodos();
    });
    
    renderTodos();
  </script>
</body>
</html>
